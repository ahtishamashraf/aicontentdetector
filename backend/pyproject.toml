[project]
name = "originlens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1","uvicorn[standard]==0.35.0","pydantic-settings==2.10.1","sqlalchemy==2.0.43","psycopg[binary]==3.2.9","alembic==1.16.5","redis==6.4.0","celery==5.5.3","cryptography==45.0.6","argon2-cffi==25.1.0","python-multipart==0.0.20","pypdf==6.0.0","python-docx==1.2.0","lingua-language-detector==2.1.1","transformers==4.55.2","safetensors==0.6.2","torch==2.8.0"]
[project.optional-dependencies]
dev=["pytest==8.4.1","pytest-asyncio==1.1.0","httpx==0.28.1","ruff==0.16.3","mypy==1.17.1"]
[tool.pytest.ini_options]
pythonpath=["."]
[tool.ruff]
line-length=100
[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
