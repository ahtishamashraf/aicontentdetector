services:
  postgres:
    image: postgres:16.4-alpine
    environment: {POSTGRES_DB: originlens, POSTGRES_USER: originlens, POSTGRES_PASSWORD: originlens}
    healthcheck: {test: [CMD-SHELL, pg_isready -U originlens], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7.4-alpine
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: {context: ., dockerfile: backend/Dockerfile.api}
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile.worker}
    env_file: [.env]
    depends_on: [postgres, redis]
  frontend:
    build: {context: frontend}
    ports: ["3000:3000"]
    depends_on: [api]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
